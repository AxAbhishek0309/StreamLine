services:
  # ── FastAPI Backend ────────────────────────────────────────────────────────
  - type: web
    name: streamline-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: StreamLine
      - key: DEBUG
        value: false
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SYNC_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_PUBSUB_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/streamline/uploads
      - key: MAX_FILE_SIZE_MB
        value: 100

  # ── Celery Worker ──────────────────────────────────────────────────────────
  - type: worker
    name: streamline-worker
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A worker.celery_app.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: APP_NAME
        value: StreamLine
      - key: DEBUG
        value: false
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SYNC_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_PUBSUB_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/streamline/uploads

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  - type: web
    name: streamline-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_WS_URL
        sync: false
