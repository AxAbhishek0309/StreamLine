version: "3.9"

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamline
      POSTGRES_PASSWORD: streamline
      POSTGRES_DB: streamline
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamline"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend ─────────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://streamline:streamline@postgres:5432/streamline
      DATABASE_SYNC_URL: postgresql+psycopg2://streamline:streamline@postgres:5432/streamline
      REDIS_URL: redis://redis:6379/0
      REDIS_PUBSUB_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - uploads_data:/tmp/streamline/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_SYNC_URL: postgresql+psycopg2://streamline:streamline@postgres:5432/streamline
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Celery Worker ────────────────────────────────────────────────────────────

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A worker.celery_app.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://streamline:streamline@postgres:5432/streamline
      DATABASE_SYNC_URL: postgresql+psycopg2://streamline:streamline@postgres:5432/streamline
      REDIS_URL: redis://redis:6379/0
      REDIS_PUBSUB_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
    volumes:
      - ./backend:/app
      - uploads_data:/tmp/streamline/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
